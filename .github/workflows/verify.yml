name: Verify

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mobile:
    name: Mobile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # @mobiscroll/react-trial comes from a private registry. The local .npmrc
      # holding that token is gitignored, so CI has to write its own.
      - name: Authenticate to the mobiscroll registry
        working-directory: mobile
        env:
          MOBISCROLL_TOKEN: ${{ secrets.MOBISCROLL_TOKEN }}
        run: |
          if [ -z "$MOBISCROLL_TOKEN" ]; then
            echo "::error::MOBISCROLL_TOKEN secret is not set — @mobiscroll/* cannot be installed."
            exit 1
          fi
          {
            echo "@mobiscroll:registry=https://npm.mobiscroll.com"
            echo "//npm.mobiscroll.com/:_authToken=${MOBISCROLL_TOKEN}"
          } > .npmrc

      - name: Install
        working-directory: mobile
        run: npm ci

      - name: Verify
        working-directory: mobile
        run: npm run verify

      - name: Build
        working-directory: mobile
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        working-directory: backend
        run: npm ci

      # The client is generated into a gitignored directory, and the backend
      # imports its types — without this the typecheck cannot resolve them.
      - name: Generate Prisma client
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/platch
        run: npx prisma generate

      - name: Verify
        working-directory: backend
        run: npm run verify

      - name: Build
        working-directory: backend
        run: npm run build
